<!DOCTYPE html>
<html>
<head>
    <title>Inspection Submitted</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px 25px;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .checkmark { font-size: 80px; }
        h1 { color: #4CAF50; }
        p { color: #555; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">✅</div>
        <h1>Submitted!</h1>
        <p><strong>{{ inspection_type }}</strong> inspection for <strong>{{ vehicle_name }}</strong> has been recorded.</p>
        <p>Thank you!</p>
    </div>
</body>
</html>
